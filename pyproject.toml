[project]
name = "pipeline-movilizacion-financiera"
version = "0.1.0"
description = "Pipeline ELT sobre datos abiertos financieros de Colombia"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pandas==3.0.1",
    "pyarrow>=21.0.0",
    "duckdb>=1.4.0",
    "requests>=2.32.0",
    "dbt-duckdb>=1.9.0",
    "prefect>=3.1.0",
    "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=6.0",
    "ruff>=0.6",
    "moto[server]>=5.0",
]

# Con `pip install -e .` queda el comando `pipeline` en el PATH, sin depender de
# exportar PYTHONPATH en cada terminal.
[project.scripts]
pipeline = "pipeline.cli:main"

[tool.setuptools]
packages = ["pipeline"]
package-dir = { "" = "src" }

# Sin esto, pytest desde la raíz no encuentra el paquete y hay que exportar
# PYTHONPATH a mano en cada terminal.
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["pipeline"]
